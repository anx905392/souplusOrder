<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元生補湯叫貨系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary-color: #2c3e50; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; background-color: #525659; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .control-panel { background: white; width: 95%; max-width: 950px; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); box-sizing: border-box; }
        
        /* 暫存狀態提示燈 */
        .storage-status { background-color: #e8f8f5; color: #27ae60; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; margin-bottom: 15px; font-size: 14px; border: 1px solid #27ae60; display: none; }
        
        .category-row { 
            display: flex; 
            flex-wrap: wrap;
            align-items: center; 
            gap: 8px; 
            padding: 10px; 
            margin-bottom: 8px; 
            background: #f8f9fa; 
            border-radius: 5px; 
            border: 1px solid #eee;
        }
        .cat-label { width: 70px; font-weight: bold; color: var(--primary-color); font-size: 15px; }
        
        select, input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; -webkit-appearance: none; }
        .input-item { flex: 1; min-width: 200px; }
        .input-small { width: 70px; }
        .input-unit { width: 75px; }

        .btn-add { background: #27ae60; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 16px; }
        .btn-add:active { background: #219150; transform: scale(0.95); }

        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; border-top: 1px solid #ddd; padding-top: 15px; }
        .btn-pdf { background: #e67e22; color: white; border: none; padding: 12px; flex: 1; min-width: 150px; cursor: pointer; border-radius: 4px; font-size: 16px; font-weight: bold; }
        .btn-jpg { background: #d35400; color: white; border: none; padding: 12px; flex: 1; min-width: 150px; cursor: pointer; border-radius: 4px; font-size: 16px; font-weight: bold; }
        .btn-clear { background: #7f8c8d; color: white; border: none; padding: 12px; flex: 1; min-width: 150px; cursor: pointer; border-radius: 4px; font-size: 16px; font-weight: bold; }

        #word-template { 
            background: white; 
            width: 210mm; 
            padding: 10mm 15mm; 
            margin: 0 auto; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            box-sizing: border-box;
            color: #000;
        }
        .doc-header { text-align: center; border-bottom: 3px solid var(--primary-color); padding-bottom: 5px; margin-bottom: 10px; }
        .doc-title { font-size: 28px; letter-spacing: 5px; color: var(--primary-color); margin: 0; font-weight: 900; }
        .doc-info { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; font-weight: bold; }
        
        .category-section { width: 100%; margin-bottom: 15px; }
        .category-title { background-color: #f2f2f2; padding: 4px 10px; font-weight: bold; border-left: 5px solid var(--primary-color); margin-bottom: 3px; font-size: 14px; border: 1px solid #ccc; }
        
        .doc-table { width: 100%; border-collapse: collapse; border: 1px solid #000; }
        .doc-table th, .doc-table td { border: 1px solid #000; padding: 6px; font-size: 14px; text-align: center; }
        .doc-table th { background: #eee; }
        .no-print-btn { color: #e74c3c; cursor: pointer; border: none; background: none; font-size: 18px; padding: 0 10px; }

        /* 行動版 RWD 縮放預覽區塊 */
        @media screen and (max-width: 768px) {
            #word-template { width: 100%; padding: 10px; font-size: 12px; }
            .doc-title { font-size: 22px; }
            .control-panel { width: 100%; padding: 10px; }
            .category-row { flex-direction: column; align-items: stretch; }
            .cat-label { width: 100%; margin-bottom: 5px; }
            .input-item { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <h3 style="margin:0 0 15px 0; text-align:center;">📋 元生補湯叫貨系統</h3>
        
        <!-- 自動恢復提示區域 -->
        <div id="status-msg" class="storage-status">🔄 已自動恢復上次未完成的叫貨清單</div>

        <div id="ui-container"></div>
        <div class="btn-group">
            <button class="btn-pdf" onclick="exportPDF()">正式 PDF 下載</button>
            <button class="btn-jpg" onclick="exportJPG()">匯出 JPG 圖片</button>
            <button class="btn-clear" onclick="clearAllData()">🗑️ 清空叫貨單</button>
        </div>
    </div>

    <div id="word-template">
        <div class="doc-header">
            <h1 class="doc-title">叫 貨 單</h1>
        </div>
        <div class="doc-info">
            <div><strong>店別：</strong> 元生補湯</div>
            <div><strong>日期：</strong> <span id="current-date"></span></div>
        </div>
        <div id="tables-container">
            <p style="color: #999; text-align: center; margin-top: 30px;">請選擇品項並點擊「＋」加入清單</p>
        </div>
    </div>

    <script>
        const unitMap = {
            "大成沙拉油":"桶","萬家香醬油":"箱","萬家香油膏":"箱","萬家香香菇素蠔油":"桶","米霖":"罐","哈哈辣豆瓣醬":"罐","味島鰹魚調味料":"盒","煉乳":"罐","鮮奶油":"罐","吉利丁片":"盒","鹽巴":"包","料理米酒":"箱","香油":"桶","蔥酥":"包","蒜酥":"包","柴魚片(粗)":"包","黑陰豆鼓":"桶","朝日白蔭豆鼓":"桶","糖砂糖":"箱","冰糖":"箱","黑糖":"包","太白粉":"斤","中筋麵粉":"包","麥芽糖":"桶","豆腐乳":"罐","杏仁甜酒":"罐","洋菜粉":"包","圓糯米":"斤","黑紫米":"斤","大紅豆":"斤","雪蓮子":"斤","白木耳":"斤","蜜黑豆":"盒",
            "8304-盒":"箱","8305-蓋":"箱","1000-牛皮碗":"箱","1000-凸蓋":"箱","1000-平蓋":"箱","1000-碗(雞湯麵線)中間隔層":"箱","750-碗":"箱","750-蓋":"箱","500-碗":"箱","260-碗(新玉山)":"箱","260-蓋(新玉山)":"箱","YS-120蓋":"箱","140-杯":"箱","75-蓋":"箱","雙生筷":"箱","茶匙(大)":"包","單包湯匙":"箱","點心盒":"條","吐司盒":"條","方形蒸籠紙":"包","醬料杯":"個","2斤袋":"包","3斤袋":"包","半斤袋":"包","嘉美清潔包特大":"包","寶島垃圾袋大":"包","嘉美垃圾袋小紅":"包","垃圾袋黑":"包","南亞保鮮膜(短)":"支","保鮮膜(長)支":"支","鋁箔(短)":"支","雙色手套":"雙","紫色手套":"雙","膠圈":"包","紙包牙籤":"盒","百利海綿布":"包","焦碳垢海綿布":"包","濾網(綠色)":"包","白毛巾":"包","12x40pp膠帶":"捲","48x80pp膠帶":"捲","小瓦斯罐":"罐","漂白水":"桶","沙拉脫":"箱","濕紙巾":"箱","扇形紙":"箱","優活小抽":"箱","邦尼熊擦手紙":"箱","舒潔擦手紙":"箱","6杯袋":"袋","4杯袋":"袋","2杯袋":"袋","洗碗機乾劑":"桶","消毒酒精":"桶",
            "鮮魚藥材":"份","百合藥材":"份","甘麥藥材":"份","四物牛蒡藥材":"份","通乳方代煎":"件","固筋骨代煎":"件","生化代煎":"件","四物代煎":"件","清冠代煎":"件","滷豬腳":"包","滷排骨":"包","黑豆板魚":"件","大鍋粥底":"份","店用茶水":"件","銀耳雪蓮藥包":"包","桂圓藥包":"包","桂圓":"斤","紅棗":"斤","枸杞":"斤","元生堂胡椒鹽":"份",
            "好美麗":"包","好順心":"包","好安神":"包","好氣色":"包","好水漾":"包","好明白":"包","好口氣":"包","好養生":"包","好骨氣":"包","寶乳茶":"包","好聲調":"包","速補好水漾":"包","速補好輕鬆":"包","速補好桑芭":"包","大紅棗":"包","大枸杞":"包","五香滷包":"包","仙楂餅":"包","元生堂防蚊包":"包",
            "甘草金桔":"包","薄荷金桔":"包","有籽橄欖":"包","丁香橄欖":"包","薑黃橄欖":"包","養生果仁":"包","養生堅果":"包","南瓜子":"包","杏仁茶":"箱","薏仁茶":"罐","芝麻糊":"罐","烏梅八仙果":"桶","十八Q喉糖":"箱","十八甘草檸檬":"箱","十八潤喉丸":"盒","十八銅人青草止痛油膏":"盒","十八銅人貼布":"個","十八銅人冠攔高手":"盒","日月滴雞精":"盒","日月滴魚精":"盒","四物鐵飲":"箱","紅景天":"組"
        };

        const products = {
            "乾貨類": ["大成沙拉油", "萬家香醬油", "萬家香油膏", "萬家香香菇素蠔油", "米霖", "哈哈辣豆瓣醬", "味島鰹魚調味料", "煉乳", "鮮奶油", "吉利丁片", "鹽巴", "料理米酒", "香油", "蔥酥", "蒜酥", "柴魚片(粗)", "黑陰豆鼓", "朝日白蔭豆鼓", "糖砂糖", "冰糖", "黑糖", "太白粉", "中筋麵粉", "麥芽糖", "豆腐乳", "杏仁甜酒", "洋菜粉", "圓糯米", "黑紫米", "大紅豆", "雪蓮子", "白木耳", "蜜黑豆"],
            "餐具類": ["8304-盒", "8305-蓋", "1000-牛皮碗", "1000-凸蓋", "1000-平蓋", "1000-碗(雞湯麵線)中間隔層", "750-碗", "750-蓋", "500-碗", "260-碗(新玉山)", "260-蓋(新玉山)", "YS-120蓋", "140-杯", "75-蓋", "雙生筷", "茶匙(大)", "單包湯匙", "點心盒", "吐司盒", "方形蒸籠紙", "醬料杯", "2斤袋", "3斤袋", "半斤袋", "嘉美清潔包特大", "嘉美垃圾袋小紅", "寶島垃圾袋大", "垃圾袋黑", "南亞保鮮膜(短)", "保鮮膜(長)", "鋁箔(短)", "雙色手套", "紫色手套", "膠圈", "紙包牙籤", "百利海綿布", "焦碳垢海綿布", "濾網(綠色)", "白毛巾", "12x40pp膠帶", "48x80pp膠帶", "小瓦斯罐", "漂白水", "沙拉脫", "濕紙巾", "扇形紙", "優活小抽", "邦尼熊擦手紙", "舒潔擦手紙", "6杯袋", "4杯袋", "2杯袋", "洗碗機乾劑", "消毒酒精"],
            "藥材類": ["鮮魚藥材", "百合藥材", "甘麥藥材", "四物牛蒡藥材", "通乳方代煎", "固筋骨代煎", "生化代煎", "四物代煎", "清冠代煎", "滷豬腳", "滷排骨", "黑豆板魚", "大鍋粥底", "店用茶水", "銀耳雪蓮藥包", "桂圓藥包", "桂圓", "紅棗", "枸杞", "元生堂胡椒鹽"],
            "茶包類": ["好美麗", "好順心", "好安神", "好氣色", "好水漾", "好明白", "好口氣", "好養生", "好骨氣", "寶乳茶", "好聲調", "速補好水漾", "速補好輕鬆", "速補好桑芭", "大紅棗", "大枸杞", "五香滷包", "仙楂餅", "元生堂防蚊包"],
            "產品類": ["甘草金桔", "薄荷金桔", "有籽橄欖", "丁香橄欖", "薑黃橄欖", "養生果仁", "養生堅果", "南瓜子", "杏仁茶", "薏仁茶", "芝麻糊", "烏梅八仙果", "十八Q喉糖", "十八甘草檸檬", "十八潤喉丸", "十八銅人青草止痛油膏", "十八銅人貼布", "十八銅人冠攔高手", "日月滴雞精", "日月滴魚精", "四物鐵飲", "紅景天"]
        };

        const units = ["包", "箱", "桶", "罐", "盒", "條", "個", "支", "雙", "捲", "袋", "斤", "瓶", "份", "件", "組"];

        let orderData = {}; 

        function initUI() {
            const container = document.getElementById('ui-container');
            Object.keys(products).forEach(cat => {
                const row = document.createElement('div');
                row.className = 'category-row';
                row.innerHTML = `<div class="cat-label">${cat}</div>
                    <select id="select-${cat}" class="input-item" onchange="autoUnit('${cat}')">
                        <option value="">-- 選擇品項 --</option>
                        ${products[cat].map(p => `<option value="${p}">${p}</option>`).join('')}
                    </select>
                    <input type="number" id="stock-${cat}" placeholder="庫存" class="input-small">
                    <input type="number" id="qty-${cat}" value="1" class="input-small">
                    <select id="unit-${cat}" class="input-unit">${units.map(u => `<option value="${u}">${u}</option>`).join('')}</select>
                    <button class="btn-add" onclick="addItem('${cat}')">＋</button>`;
                container.appendChild(row);
            });

            // 🟢 UI 初始化後，立刻讀取本地暫存
            loadFromStorage();
        }

        function autoUnit(cat) {
            const val = document.getElementById(`select-${cat}`).value;
            if(unitMap[val]) document.getElementById(`unit-${cat}`).value = unitMap[val];
        }

        document.getElementById('current-date').innerText = new Date().toLocaleDateString('zh-TW');

        // 🟢 將資料存入手機本地端
        function saveToStorage() {
            localStorage.setItem('yuansheng_order_cache', JSON.stringify(orderData));
        }

        // 🟢 從手機本地端讀取舊資料
        function loadFromStorage() {
            const cached = localStorage.getItem('yuansheng_order_cache');
            if (cached) {
                const parsed = JSON.parse(cached);
                if (Object.keys(parsed).length > 0) {
                    orderData = parsed;
                    renderTables();
                    
                    // 顯示自動恢復的綠色提示燈
                    const statusMsg = document.getElementById('status-msg');
                    statusMsg.style.display = 'block';
                    setTimeout(() => { statusMsg.style.display = 'none'; }, 5000);
                }
            }
        }

        function addItem(cat) {
            const name = document.getElementById(`select-${cat}`).value;
            const stock = document.getElementById(`stock-${cat}`).value;
            const qty = parseFloat(document.getElementById(`qty-${cat}`).value);
            const unit = document.getElementById(`unit-${cat}`).value;
            
            if (!name) return alert("請選擇品項");
            if (isNaN(qty) || qty <= 0) return alert("請輸入正確的叫貨數量");

            if (!orderData[cat]) orderData[cat] = [];

            // 🟢 防呆：檢查該類別中是否已經點選過同名產品
            const existingItem = orderData[cat].find(item => item.name === name && item.unit === unit);
            
            if (existingItem) {
                // 如果有一致的產品與單位，直接累加數量，並更新最新的庫存輸入
                existingItem.qty = parseFloat(existingItem.qty) + qty;
                if (stock !== "") {
                    existingItem.stock = stock;
                }
            } else {
                // 如果是新產品，直接 push 進去
                orderData[cat].push({ 
                    name, 
                    stock: stock === "" ? "--" : stock, 
                    qty: qty, 
                    unit 
                });
            }

            // 清空操作區的庫存輸入框，回復預增數量為 1
            document.getElementById(`stock-${cat}`).value = "";
            document.getElementById(`qty-${cat}`).value = "1";
            document.getElementById(`select-${cat}`).value = ""; // 重置選單

            renderTables();
            saveToStorage(); // 🟢 每次新增立刻存檔
        }

        function removeItem(cat, i) {
            orderData[cat].splice(i, 1);
            if (orderData[cat].length === 0) delete orderData[cat];
            renderTables();
            saveToStorage(); // 🟢 每次刪除立刻存檔
        }

        // 🟢 清空按鈕
        function clearAllData() {
            if (confirm("確認要完全清空目前整張叫貨單與快取紀錄嗎？")) {
                orderData = {};
                localStorage.removeItem('yuansheng_order_cache');
                renderTables();
            }
        }

        function renderTables() {
            const container = document.getElementById('tables-container');
            container.innerHTML = '';
            const cats = Object.keys(orderData);
            if (cats.length === 0) {
                container.innerHTML = '<p style="color: #999; text-align: center; margin-top: 30px;">請選擇品項並點擊「＋」加入清單</p>';
                return;
            }
            cats.forEach(cat => {
                let div = document.createElement('div');
                div.className = 'category-section';
                div.innerHTML = `<div class="category-title">類別：${cat}</div>
                    <table class="doc-table">
                        <thead><tr><th style="width:8%">序</th><th style="width:47%">品項</th><th style="width:15%">庫存</th><th style="width:20%">量</th><th style="width:10%" class="no-print">✕</th></tr></thead>
                        <tbody>${orderData[cat].map((item, i) => `<tr><td>${i+1}</td><td style="text-align:left">${item.name}</td><td>${item.stock}</td><td>${item.qty} ${item.unit}</td><td class="no-print"><button class="no-print-btn" onclick="removeItem('${cat}',${i})">🗑</button></td></tr>`).join('')}</tbody>
                    </table>`;
                container.appendChild(div);
            });
        }

        function toggleNoPrint(s) { document.querySelectorAll('.no-print').forEach(el => el.style.display = s ? '' : 'none'); }

        function exportPDF() {
            if (Object.keys(orderData).length === 0) return alert("清單是空的");
            toggleNoPrint(false);
            html2pdf().set({ margin: 5, filename: `叫貨單_${new Date().toISOString().slice(0,10)}.pdf`, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(document.getElementById('word-template')).save().then(() => toggleNoPrint(true));
        }

        function exportJPG() {
            if (Object.keys(orderData).length === 0) return alert("清單是空的");
            toggleNoPrint(false);
            html2canvas(document.getElementById('word-template'), { scale: 3, backgroundColor: "#ffffff" }).then(canvas => {
                const a = document.createElement('a'); a.download = `叫貨單_${new Date().toISOString().slice(0,10)}.jpg`; a.href = canvas.toDataURL("image/jpeg", 0.9); a.click(); toggleNoPrint(true);
            });
        }

        initUI();
    </script>
</body>
</html>
