<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>補湯叫貨系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary-color: #2c3e50; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #525659; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* 操作面板：改為垂直列出四類 */
        .control-panel { background: white; width: 900px; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .category-row { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            padding: 10px; 
            margin-bottom: 8px; 
            background: #f8f9fa; 
            border-radius: 5px; 
            border: 1px solid #eee;
        }
        .cat-label { width: 80px; font-weight: bold; color: var(--primary-color); }
        
        select, input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .input-item { flex: 2; }
        .input-small { width: 70px; }
        .input-unit { width: 70px; }

        .btn-add { background: #27ae60; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-add:hover { background: #219150; }

        .btn-group { display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid #ddd; padding-top: 15px; }
        .btn-pdf { background: #e67e22; color: white; border: none; padding: 12px; flex: 1; cursor: pointer; border-radius: 4px; font-size: 18px; font-weight: bold; }
        .btn-jpg { background: #d35400; color: white; border: none; padding: 12px; flex: 1; cursor: pointer; border-radius: 4px; font-size: 18px; font-weight: bold; }

        /* A4 模板樣式 */
        #word-template { 
            background: white; 
            width: 210mm; 
            padding: 10mm 20mm; 
            margin: 0 auto; 
            box-sizing: border-box;
        }
        .doc-header { text-align: center; border-bottom: 3px solid var(--primary-color); padding-bottom: 8px; margin-bottom: 12px; }
        .doc-title { font-size: 32px; letter-spacing: 6px; color: var(--primary-color); margin: 0; font-weight: 900; }
        .doc-info { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 16px; font-weight: bold; }
        
        .category-section { width: 100%; margin-bottom: 15px; }
        .category-title { background-color: #f8f9fa; padding: 5px 12px; font-weight: bold; border-left: 6px solid var(--primary-color); margin-bottom: 5px; font-size: 16px; border-bottom: 1px solid #ddd; color: #1a252f; }
        
        .doc-table { width: 100%; border-collapse: collapse; border: 1px solid #000; }
        .doc-table th, .doc-table td { border: 1px solid #000; padding: 6px 8px; font-size: 16px; text-align: center; }
        .doc-table th { background: #f2f2f2; }
        .qty-text { font-size: 17px; font-weight: bold; }
        .no-print-btn { color: #e74c3c; cursor: pointer; border: none; background: none; font-size: 18px; }
    </style>
</head>
<body>

    <div class="control-panel">
        <h3 style="margin-top:0">📋 補湯叫貨系統 (分類點選版)</h3>
        
        <div class="category-row">
            <div class="cat-label">藥材類</div>
            <select id="select-藥材類" class="input-item">
                <option value="">-- 選擇品項 --</option>
                <option value="藥膳排骨湯包">藥膳排骨湯包</option>
                <option value="十全大補湯包">十全大補湯包</option>
                <option value="四神湯料包">四神湯料包</option>
                <option value="玉竹清潤包">玉竹清潤包</option>
            </select>
            <input type="number" id="stock-藥材類" placeholder="庫存" class="input-small">
            <input type="number" id="qty-藥材類" value="1" class="input-small">
            <select id="unit-藥材類" class="input-unit">
                <option value="包">包</option><option value="箱">箱</option>
            </select>
            <button class="btn-add" onclick="addItem('藥材類')">＋ 加入</button>
        </div>

        <div class="category-row">
            <div class="cat-label">乾貨類</div>
            <select id="select-乾貨類" class="input-item">
                <option value="">-- 選擇品項 --</option>
                <option value="特製中藥粉">特製中藥粉</option>
                <option value="純釀醬油">純釀醬油</option>
            </select>
            <input type="number" id="stock-乾貨類" placeholder="庫存" class="input-small">
            <input type="number" id="qty-乾貨類" value="1" class="input-small">
            <select id="unit-乾貨類" class="input-unit">
                <option value="罐">罐</option><option value="桶">桶</option><option value="斤">斤</option>
            </select>
            <button class="btn-add" onclick="addItem('乾貨類')">＋ 加入</button>
        </div>

        <div class="category-row">
            <div class="cat-label">餐具類</div>
            <select id="select-餐具類" class="input-item">
                <option value="">-- 選擇品項 --</option>
                <option value="專用外帶紙袋">專用外帶紙袋</option>
                <option value="免洗筷">免洗筷</option>
            </select>
            <input type="number" id="stock-餐具類" placeholder="庫存" class="input-small">
            <input type="number" id="qty-餐具類" value="1" class="input-small">
            <select id="unit-餐具類" class="input-unit">
                <option value="包">包</option><option value="件">件</option><option value="個">個</option>
            </select>
            <button class="btn-add" onclick="addItem('餐具類')">＋ 加入</button>
        </div>

        <div class="category-row">
            <div class="cat-label">產品類</div>
            <select id="select-產品類" class="input-item">
                <option value="">-- 選擇品項 --</option>
                <option value="冷凍加熱包">冷凍加熱包</option>
                <option value="禮盒組">禮盒組</option>
            </select>
            <input type="number" id="stock-產品類" placeholder="庫存" class="input-small">
            <input type="number" id="qty-產品類" value="1" class="input-small">
            <select id="unit-產品類" class="input-unit">
                <option value="組">組</option><option value="盒">盒</option>
            </select>
            <button class="btn-add" onclick="addItem('產品類')">＋ 加入</button>
        </div>
        
        <div class="btn-group">
            <button class="btn-pdf" onclick="exportPDF()">匯出正式 PDF</button>
            <button class="btn-jpg" onclick="exportJPG()">匯出 JPG 圖片</button>
        </div>
    </div>

    <div id="word-template">
        <div class="doc-header">
            <h1 class="doc-title">叫 貨 單</h1>
        </div>
        <div class="doc-info">
            <div><strong>申請店別：</strong> 元生補湯</div>
            <div><strong>叫貨日期：</strong> <span id="current-date"></span></div>
        </div>
        <div id="tables-container">
            <p style="color: #999; text-align: center; margin-top: 50px; font-size: 20px;">請從上方選單加入產品...</p>
        </div>
    </div>

    <script>
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('zh-TW');
        let orderData = {}; 

        function addItem(category) {
            const name = document.getElementById(`select-${category}`).value;
            const stock = document.getElementById(`stock-${category}`).value;
            const qty = document.getElementById(`qty-${category}`).value;
            const unit = document.getElementById(`unit-${category}`).value;
            
            if (!name) return alert("請先選擇品項");

            if (!orderData[category]) orderData[category] = [];
            const displayStock = stock === "" ? "--" : stock;

            orderData[category].push({ name, stock: displayStock, qty, unit });

            // 重置輸入框
            document.getElementById(`stock-${category}`).value = "";
            renderTables();
        }

        function removeItem(category, index) {
            orderData[category].splice(index, 1);
            if (orderData[category].length === 0) delete orderData[category];
            renderTables();
        }

        function renderTables() {
            const container = document.getElementById('tables-container');
            container.innerHTML = '';
            
            const categories = Object.keys(orderData);
            if (categories.length === 0) {
                container.innerHTML = '<p style="color: #999; text-align: center; margin-top: 50px; font-size: 20px;">請從上方選單加入產品...</p>';
                return;
            }

            categories.forEach(cat => {
                let section = document.createElement('div');
                section.className = 'category-section';
                section.innerHTML = `
                    <div class="category-title">類別：${cat}</div>
                    <table class="doc-table">
                        <thead>
                            <tr>
                                <th style="width: 10%;">項次</th>
                                <th style="width: 40%;">品項名稱</th>
                                <th style="width: 20%;">現有庫存</th>
                                <th style="width: 20%;">訂購數量</th>
                                <th style="width: 10%;" class="no-print">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${orderData[cat].map((item, index) => `
                                <tr>
                                    <td>${index + 1}</td>
                                    <td style="text-align: left;">${item.name}</td>
                                    <td>${item.stock}</td>
                                    <td><span class="qty-text">${item.qty}</span> ${item.unit}</td>
                                    <td class="no-print">
                                        <button class="no-print-btn" onclick="removeItem('${cat}', ${index})">🗑</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                container.appendChild(section);
            });
        }

        function exportPDF() {
            if (Object.keys(orderData).length === 0) return alert("清單是空的");
            const element = document.getElementById('word-template');
            const noPrints = document.querySelectorAll('.no-print');
            noPrints.forEach(el => el.style.display = 'none');

            const opt = {
                margin: 0,
                filename: `叫貨單_${new Date().toISOString().slice(0,10)}.pdf`,
                image: { type: 'jpeg', quality: 1.0 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                noPrints.forEach(el => el.style.display = '');
            });
        }

        function exportJPG() {
            if (Object.keys(orderData).length === 0) return alert("清單是空的");
            const element = document.getElementById('word-template');
            const noPrints = document.querySelectorAll('.no-print');
            noPrints.forEach(el => el.style.display = 'none');

            html2canvas(element, { scale: 3, backgroundColor: "#ffffff" }).then(canvas => {
                const link = document.createElement('a');
                link.download = `叫貨單_${new Date().toISOString().slice(0,10)}.jpg`;
                link.href = canvas.toDataURL("image/jpeg", 0.9);
                link.click();
                noPrints.forEach(el => el.style.display = '');
            });
        }
    </script>
</body>
</html>
