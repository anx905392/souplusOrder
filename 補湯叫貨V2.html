        .control-panel { background: white; width: 95%; max-width: 950px; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); box-sizing: border-box; }
        
        .storage-status { background-color: #e8f8f5; color: #27ae60; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; margin-bottom: 15px; font-size: 14px; border: 1px solid #27ae60; display: none; }
        
        .category-row { 
            display: flex; 
            flex-wrap: wrap;
            align-items: center; 
            gap: 8px; 
            padding: 10px; 
            margin-bottom: 8px; 
            background: #f8f9fa; 
            border-radius: 5px; 
            border: 1px solid #eee;
        }
        .cat-label { width: 70px; font-weight: bold; color: var(--primary-color); font-size: 15px; }
        
        select, input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; -webkit-appearance: none; }
        .input-item { flex: 1; min-width: 200px; }
        .input-small { width: 70px; }
        .input-unit { width: 75px; }

        .btn-add { background: #27ae60; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 16px; }
        .btn-add:active { background: #219150; transform: scale(0.95); }

        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; border-top: 1px solid #ddd; padding-top: 15px; }
        .btn-pdf { background: #e67e22; color: white; border: none; padding: 12px; flex: 1; min-width: 150px; cursor: pointer; border-radius: 4px; font-size: 16px; font-weight: bold; }
        .btn-jpg { background: #d35400; color: white; border: none; padding: 12px; flex: 1; min-width: 150px; cursor: pointer; border-radius: 4px; font-size: 16px; font-weight: bold; }
        .btn-clear { background: #7f8c8d; color: white; border: none; padding: 12px; flex: 1; min-width: 150px; cursor: pointer; border-radius: 4px; font-size: 16px; font-weight: bold; }

        #word-template { 
            background: white; 
            width: 210mm; 
            padding: 10mm 15mm; 
            margin: 0 auto; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            box-sizing: border-box;
            color: #000;
        }
        .doc-header { text-align: center; border-bottom: 3px solid var(--primary-color); padding-bottom: 5px; margin-bottom: 10px; }
        .doc-title { font-size: 28px; letter-spacing: 5px; color: var(--primary-color); margin: 0; font-weight: 900; }
        .doc-info { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; font-weight: bold; }
        
        .category-section { width: 100%; margin-bottom: 15px; }
        .category-title { background-color: #f2f2f2; padding: 4px 10px; font-weight: bold; border-left: 5px solid var(--primary-color); margin-bottom: 3px; font-size: 14px; border: 1px solid #ccc; }
        
        .doc-table { width: 100%; border-collapse: collapse; border: 1px solid #000; }
        .doc-table th, .doc-table td { border: 1px solid #000; padding: 6px; font-size: 14px; text-align: center; }
        .doc-table th { background: #eee; }
        .no-print-btn { color: #e74c3c; cursor: pointer; border: none; background: none; font-size: 18px; padding: 0 10px; }

        .vendor-tag { font-weight: bold; }

        @media screen and (max-width: 768px) {
            #word-template { width: 100%; padding: 10px; font-size: 12px; }
            .doc-title { font-size: 22px; }
            .control-panel { width: 100%; padding: 10px; }
            .category-row { flex-direction: column; align-items: stretch; }
            .cat-label { width: 100%; margin-bottom: 5px; }
            .input-item { width: 100%; }
        }

                const parsed = JSON.parse(cached);
                if (Object.keys(parsed).length > 0) {
                    orderData = parsed;
                    renderTables();
                    const statusMsg = document.getElementById('status-msg');
                    statusMsg.style.display = 'block';
                    setTimeout(() => { statusMsg.style.display = 'none'; }, 5000);
                }
            }
        }

        function addItem(cat) {
            const name = document.getElementById(`select-${cat}`).value;
            const stock = document.getElementById(`stock-${cat}`).value;
            const qty = parseFloat(document.getElementById(`qty-${cat}`).value);
            const unit = document.getElementById(`unit-${cat}`).value;
            
            if (!name) return alert("請選擇品項");
            if (isNaN(qty) || qty <= 0) return alert("請輸入正確的叫貨數量");

            if (!orderData[cat]) orderData[cat] = [];

            const existingItem = orderData[cat].find(item => item.name === name && item.unit === unit);
            
            if (existingItem) {
                existingItem.qty = parseFloat(existingItem.qty) + qty;
                if (stock !== "") existingItem.stock = stock;
            } else {
                orderData[cat].push({ 
                    name, 
                    stock: stock === "" ? "--" : stock, 
                    qty: qty, 
                    unit 
                });
            }

            document.getElementById(`stock-${cat}`).value = "";
            document.getElementById(`qty-${cat}`).value = "1";
            document.getElementById(`select-${cat}`).value = ""; 

            renderTables();
            saveToStorage(); 
        }

        function removeItem(globalVendor, globalIndex) {
            // 由於改為廠商渲染，刪除需要根據當初傳遞的真實資料進行交叉比對
            let itemDeleted = false;
            for (let cat in orderData) {
                let matchIndex = orderData[cat].findIndex(item => {
                    const match = item.name.match(/^\[(.*?)\]/);
                    const vName = match ? match[1] : "未分類/其他項目";
                    return vName === globalVendor && item.name === orderData[cat].filter(i => {
                        const m = i.name.match(/^\[(.*?)\]/);
                        return (m ? m[1] : "未分類/其他項目") === globalVendor;
                    })[globalIndex]?.name;
                });

                if (matchIndex !== -1) {
                    orderData[cat].splice(matchIndex, 1);
                    if (orderData[cat].length === 0) delete orderData[cat];
                    itemDeleted = true;
                    break;
                }
            }
            renderTables();
            saveToStorage(); 
        }

        function clearAllData() {
            if (confirm("確認要完全清空目前整張叫貨單與快取紀錄嗎？")) {
                orderData = {};
                localStorage.removeItem('yuansheng_order_cache');
                renderTables();
            }
        }

        // 🟢 核心修正區：將原本以「品項大類(cat)」渲染的結構，改為以「廠商(Vendor)」重新重組並排序渲染
        function renderTables() {
            const container = document.getElementById('tables-container');
            container.innerHTML = '';
            
            // 步驟 1：收集目前所有已點選的商品，並將它們改為用「廠商名稱」進行重新分組
            let vendorGroup = {};
            
            Object.keys(orderData).forEach(cat => {
                orderData[cat].forEach(item => {
                    const match = item.name.match(/^\[(.*?)\]/);
                    const vendorName = match ? match[1] : "未分類/其他項目"; // 沒有中括號的放到未分類
                    
                    if (!vendorGroup[vendorName]) {
                        vendorGroup[vendorName] = [];
                    }
                    vendorGroup[vendorName].push(item);
                });
            });

            const vendors = Object.keys(vendorGroup);
            if (vendors.length === 0) {
                container.innerHTML = '<p style="color: #999; text-align: center; margin-top: 30px;">請選擇品項並點擊「＋」加入清單</p>';
                return;
            }

            // 步驟 2：將廠商排序（讓未分類項目永遠排在整張單子的最後面）
            vendors.sort((a, b) => {
                if (a === "未分類/其他項目") return 1;
                if (b === "未分類/其他項目") return -1;
                return a.localeCompare(b, 'zh-TW');
            });

            // 步驟 3：依廠商產生各自的表格
            vendors.forEach(vendor => {
                // 廠商內部所有品項依字母/筆劃排序
                vendorGroup[vendor].sort((a, b) => a.name.localeCompare(b.name, 'zh-TW'));

                let div = document.createElement('div');
                div.className = 'category-section';
                
                const rowsHTML = vendorGroup[vendor].map((item, i) => {
                    let displayName = item.name;
                    if (vendor !== "未分類/其他項目") {
                        const assignedColor = getVendorColor(vendor);
                        displayName = item.name.replace(/^(\[.*?\])/, `<span class="vendor-tag" style="color: ${assignedColor};">$1</span>`);
                    }
                    
                    return `<tr>
                        <td>${i+1}</td>
                        <td style="text-align:left">${displayName}</td>
                        <td>${item.stock}</td>
                        <td>${item.qty} ${item.unit}</td>
                        <td class="no-print"><button class="no-print-btn" onclick="removeItem('${vendor}',${i})">🗑</button></td>
                    </tr>`;
                }).join('');

                div.innerHTML = `<div class="category-title">廠商：${vendor}</div>
                    <table class="doc-table">
                        <thead><tr><th style="width:8%">序</th><th style="width:47%">品項</th><th style="width:15%">庫存</th><th style="width:20%">量</th><th style="width:10%" class="no-print">✕</th></tr></thead>
                        <tbody>${rowsHTML}</tbody>
                    </table>`;
                container.appendChild(div);
            });
        }

        function toggleNoPrint(s) { document.querySelectorAll('.no-print').forEach(el => el.style.display = s ? '' : 'none'); }

        function exportPDF() {
            if (Object.keys(orderData).length === 0) return alert("清單是空的");
            toggleNoPrint(false);
            html2pdf().set({ margin: 5, filename: `叫貨單_${new Date().toISOString().slice(0,10)}.pdf`, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(document.getElementById('word-template')).save().then(() => toggleNoPrint(true));
        }

        function exportJPG() {
            if (Object.keys(orderData).length === 0) return alert("清單是空的");
            toggleNoPrint(false);
            html2canvas(document.getElementById('word-template'), { scale: 3, backgroundColor: "#ffffff" }).then(canvas => {
                const a = document.createElement('a'); a.download = `叫貨單_${new Date().toISOString().slice(0,10)}.jpg`; a.href = canvas.toDataURL("image/jpeg", 0.9); a.click(); toggleNoPrint(true);
            });
        }

        initUI();
    </script>
</body>
</html>
